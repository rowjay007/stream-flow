name: Raft Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  raft-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Run raft integration tests
        run: |
          go test ./broker/internal/raft -run TestSingleNodeRestart -v
          go test ./broker/internal/raft -run TestClusterRollingRestart -v
