apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
      - name: processor
        image: streamflow/processor:latest
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "./bin/backup --download /tmp/snapshot.snap || true; curl -sS --fail http://localhost:8080/drain || true; sleep 2"]
        ports:
        - containerPort: 8080
